<div class="splash-container" [class.exiting]="isExiting">
  <div class="splash-aurora splash-aurora--left" aria-hidden="true"></div>
  <div class="splash-aurora splash-aurora--right" aria-hidden="true"></div>

  <div class="splash-stage">
    <section class="splash-panel" aria-label="Intro">
      <p class="splash-eyebrow">Engineering • Data • AI</p>
      <h1 class="splash-header">Ibis Equity Consulting, LLC</h1>
      <p class="splash-text">Software Engineering for Artificial Intelligence</p>
      <p class="splash-text splash-text--secondary">Machine Learning, Generative AI, Data Science, Cloud Computing, &amp; Agentic AI</p>
      <p class="splash-instruction">Click anywhere or press Enter to continue</p>
    </section>

    <div class="splash-media-frame">
      <video 
        #videoPlayer
        class="splash-gif"
        muted
        autoplay 
        loop 
        playsinline
        webkit-playsinline>
        <source src="/animations/new_ibis_gif.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</div>
